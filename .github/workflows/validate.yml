name: Validate
on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        id: dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "11.0.x"

      - name: Select installed SDK
        env:
          DOTNET_SDK_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          dotnet new globaljson --sdk-version "$DOTNET_SDK_VERSION" --roll-forward disable
          dotnet --version

      - name: Restore
        run: dotnet restore src/ClearServiceBusInitializer.sln --source https://api.nuget.org/v3/index.json

      - name: Build (Release)
        run: dotnet build src/ClearServiceBusInitializer.sln -c Release --no-restore -p:GeneratePackageOnBuild=false

      - name: Test
        run: dotnet test src/ClearServiceBusInitializer.sln -c Release --no-build --no-restore

      - name: Pack ClearServiceBusInitializer
        run: dotnet pack src/ClearServiceBusInitializer/ClearServiceBusInitializer.csproj -c Release --no-build -o ./artifacts
